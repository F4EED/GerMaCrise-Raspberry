server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Contours + générateur CLI MeshCore (fichiers locaux, HTTP Range inutile).
    location /meshcore-regions/ {
        alias /usr/share/nginx/html/meshcore-regions/;
        autoindex off;
    }
}
